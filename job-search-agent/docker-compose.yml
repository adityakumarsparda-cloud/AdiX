# Optional local orchestration. The project also runs fine without Docker
# (see README). Ollama is optional; uncomment its service to run it in a container,
# or install it natively from https://ollama.com.

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./config:/config:ro
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "8000:8000"
    # depends_on:
    #   - ollama

  frontend:
    build: ./frontend
    command: npm run dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

